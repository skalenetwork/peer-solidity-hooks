[profile.default]
src = "contracts"
out = "forge-out"
cache_path = "forge-cache"
libs = ["node_modules", "lib"]
script = "script"
test = "foundry-test"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
# Skip hardhat-dependency-compiler stubs (auto-generated, contain glob imports
# that are not valid for a pure solc/foundry build).
skip = ["contracts/hardhat-dependency-compiler/**/*"]
# Silence harmless remapping ambiguity / license warnings from transitive deps.
ignored_warnings_from = ["node_modules"]

[profile.ci]
verbosity = 3

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
int_types = "long"
